[theme]
primaryColor = "#667eea"
secondaryColor = "#764ba2"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
font = "sans serif"

[server]
maxUploadSize = 300
enableCORS = false
enableXsrfProtection = false

[client]
showErrorDetails = false

[logger]
level = "info"
